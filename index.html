<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1A1A1A" />
  <title>Günlük Oyunlar</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="games.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <div class="section-heading" >DİL</div>
        <div id="languageFilters" aria-label="Oyun dili filtreleri"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-heading" >KATEGORİLER</div>
        <div id="categoryFilters"></div>
      </div>  
    </aside>
    <main class="content">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="Menüyü aç/kapat" aria-expanded="false" aria-controls="sidebar">☰</button>
        <div>
          <p id="resultCount" class="result-count"></p>
          <button id="clearFilters" class="clear-btn" >Filtreleri temizle ↗</button>
        </div>
        <div class="eyebrow" >
          <span>"ooof.." -Bedirhan Uncu</span>
        </div>
      </header>
      <section class="games-section">
        <div class="games-heading"></div>
        <div id="gameGrid" class="game-grid"></div>
        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-icon">◇</div><h3 >Oyun bulunamadı</h3><p >Başka dil veya kategori seçmeyi dene.</p>
        </div>
      </section>
      <footer>© <span id="year"></span> · Amcuk</footer>
    </main>
  </div>
</body>
</html>
